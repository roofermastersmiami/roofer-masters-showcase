name: Audit production migration readiness (read-only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type AUDIT_ONLY to run a read-only production migration audit"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only production migration ledger audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require read-only audit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "AUDIT_ONLY" ]; then
            echo "::error::Confirmation must exactly equal AUDIT_ONLY."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate repository migration journal
        run: npm run check:migrations

      - name: Compare production ledger with repository journal (read only)
        env:
          LOVABLE_DB_MIGRATION_URL: ${{ secrets.LOVABLE_DB_MIGRATION_URL }}
        run: |
          if [ -z "$LOVABLE_DB_MIGRATION_URL" ]; then
            echo "::error::Repository secret LOVABLE_DB_MIGRATION_URL is not configured."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import postgres from "postgres";

          const journal = JSON.parse(fs.readFileSync("drizzle/migrations/meta/_journal.json", "utf8"));
          const sql = postgres(process.env.LOVABLE_DB_MIGRATION_URL, {
            max: 1,
            connect_timeout: 10,
            idle_timeout: 5,
            prepare: false,
          });

          try {
            const rows = await sql`
              select id, created_at
              from drizzle.__drizzle_migrations
              order by created_at asc, id asc
            `;
            const appliedTimestamps = new Set(rows.map((row) => String(row.created_at)));
            const pending = journal.entries.filter((entry) =>
              !appliedTimestamps.has(String(entry.when))
            );

            console.log(`Production migration ledger rows: ${rows.length}`);
            console.log(`Latest production migration timestamp: ${rows.at(-1)?.created_at ?? "none"}`);
            console.log(`Repository migrations not present in production ledger: ${pending.length}`);
            for (const entry of pending) {
              console.log(`PENDING ${entry.tag} (${entry.when})`);
            }

            if (pending.length > 0) {
              console.error("::error::Production has pending journal entries. This audit intentionally performs no DDL. Reconcile schema and ledger before any migration runner is authorized.");
              process.exitCode = 2;
            }
          } finally {
            await sql.end();
          }
          NODE

      - name: Explicitly confirm no database writes were run
        if: always()
        run: echo "Read-only audit only. No migration command or database DDL was executed."
