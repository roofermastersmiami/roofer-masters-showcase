name: Publish development progress dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Read latest commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          gh api "repos/${GITHUB_REPOSITORY}/commits?sha=main&per_page=30" > /tmp/commits.json
          jq '[.[] | {sha: .sha, message: (.commit.message | split("\n")[0]), date: .commit.committer.date, author: (.author.login // .commit.author.name), url: .html_url}]' /tmp/commits.json > site/commits.json
      - name: Assemble Pages artifact
        run: cp docs/progress/index.html site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
