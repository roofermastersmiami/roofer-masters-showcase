name: Roof Detection Python Tests

on:
  pull_request:
    paths:
      - "services/roof-detection/**"
      - "render.yaml"
      - ".github/workflows/roof-detection-python.yml"
  push:
    branches: [main]
    paths:
      - "services/roof-detection/**"
      - "render.yaml"
      - ".github/workflows/roof-detection-python.yml"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/roof-detection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/roof-detection/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q main.py
      - run: pytest -q
      - name: Validate Render deployment blueprint
        run: ruby -e 'require "yaml"; config = YAML.load_file("../../render.yaml"); abort "Render blueprint must define at least one service" unless config.is_a?(Hash) && config["services"].is_a?(Array) && !config["services"].empty?'
