name: Live roof detection benchmark

on:
  workflow_dispatch:
    inputs:
      address:
        description: Property address to analyze
        required: true
        default: "3062 Southwest 189th Avenue, Miramar, FL 33029"
  push:
    branches: [main]
    paths:
      - "services/roof-detection/**"
      - ".github/workflows/live-roof-detection-benchmark.yml"

permissions:
  contents: read

jobs:
  analyze-live-property:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for Render auto-deploy and backend health
        shell: bash
        run: |
          set -euo pipefail
          # Render deploys the same main-branch push asynchronously; give the image
          # build/update time to finish before sending the live property request.
          sleep 90
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 "https://roofer-masters-roof-detection-w909.onrender.com/health" -o health.json; then
              cat health.json
              exit 0
            fi
            echo "Backend not ready yet (attempt $attempt/30); waiting 20 seconds."
            sleep 20
          done
          echo "Backend did not become healthy within 10 minutes."
          exit 1

      - name: Submit live roof analysis request
        env:
          PROPERTY_ADDRESS: ${{ inputs.address || '3062 Southwest 189th Avenue, Miramar, FL 33029' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '{"street_address":"%s"}' "$PROPERTY_ADDRESS" > request.json
          status=$(curl --silent --show-error --location --max-time 900 \
            --output response.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --request POST \
            --data-binary @request.json \
            "https://roofer-masters-roof-detection-w909.onrender.com/v1/roof/analyze")
          echo "HTTP status: $status"
          HTTP_STATUS="$status" python - <<'PY'
          import json
          import os
          from pathlib import Path
          raw = Path("response.json").read_text(errors="replace")
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              print("Backend returned a non-JSON response:")
              print(raw[:4000])
              raise SystemExit(1)
          status = int(os.environ["HTTP_STATUS"])
          if not 200 <= status < 300:
              print(json.dumps(data, indent=2))
              raise SystemExit(f"Roof analysis request failed with HTTP {status}")
          summary = {
              "status": data.get("status"),
              "verification": data.get("verification"),
              "matched_address": data.get("matched_address"),
              "location": data.get("location"),
              "footprint": {
                  "area_sqft": data.get("footprint", {}).get("area_sqft"),
                  "osm_way_id": data.get("footprint", {}).get("osm_way_id"),
                  "address_point_inside_footprint": data.get("footprint", {}).get("address_point_inside_footprint"),
                  "address_to_footprint_distance_m": data.get("footprint", {}).get("address_to_footprint_distance_m"),
              },
              "lidar": data.get("lidar"),
              "roof": {
                  "facet_count": data.get("roof", {}).get("facet_count"),
                  "area_sqft": data.get("roof", {}).get("area_sqft"),
                  "total_squares": data.get("roof", {}).get("total_squares"),
                  "dominant_pitch_rise_per_12": data.get("roof", {}).get("dominant_pitch_rise_per_12"),
                  "facets": data.get("roof", {}).get("facets"),
              },
              "fallback": data.get("fallback"),
              "disclaimer": data.get("disclaimer"),
          }
          print(json.dumps(summary, indent=2))
          Path("roof-analysis-summary.json").write_text(json.dumps(summary, indent=2))
          PY

      - name: Save benchmark response
        uses: actions/upload-artifact@v4
        with:
          name: live-roof-analysis-${{ github.run_id }}
          path: roof-analysis-summary.json
          retention-days: 30
