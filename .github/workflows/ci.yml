name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/roof-imagery-measurement-foundation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run unit tests
        run: npm test
      - name: Build production app
        run: npm run build
