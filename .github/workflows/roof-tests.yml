name: Roofer Masters Roof Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Run Roof Calculation Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: roofer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d roofer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python receptionist syntax
        run: python -m compileall -q services/receptionist
      - name: Install dependencies
        run: npm install
      - name: Validate database migration journal
        run: npm run check:migrations
      - name: Audit new privileged code for tenant review
        run: node scripts/check-tenant-security-diff.mjs
      - name: Run company permit settings PostgreSQL RLS integration test
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql "postgresql://postgres@localhost:5432/roofer_test" -v ON_ERROR_STOP=1 -f scripts/test-company-permit-settings-rls.sql
      - name: Run lint checks (baseline audit)
        run: npm run lint
        continue-on-error: true
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build
