name: Format repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-format-main
  cancel-in-progress: false

jobs:
  format:
    name: Apply repository Prettier formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12

      - name: Install pinned Prettier
        run: npm install --global prettier@3.7.3 --no-audit --no-fund

      - name: Format tracked project files
        run: prettier --write .

      - name: Commit formatting changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Repository is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Apply repository Prettier formatting"
          git push origin HEAD:main
